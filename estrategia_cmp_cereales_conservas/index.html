      if (y2 - y1 >= 13) s += `<text x="${X + w / 2}" y="${(y1 + y2) / 2 + 3.5}" font-size="9.5" font-weight="700" fill="#fff" text-anchor="middle">${Math.round(v / tot[j] * 100)}%</text>`; acc += v; });
    s += `<text x="${X + w / 2}" y="${Y(tot[j]) - 5}" font-size="10" font-weight="700" fill="#1A1A2E" text-anchor="middle">${Math.round(tot[j] / 1000)}k</text><text x="${X + w / 2}" y="${y0 + 15}" font-size="10.5" fill="#5A6560" text-anchor="middle">${MES[+m.slice(5, 7) - 1]}</text>`; });
  s += '</svg>';
  const T = sum(totTipo);

  const esc = totTipo[0] / T;

   <div class="note g" style="margin-top:12px"><b>Lo que se puede tocar:</b> la propuesta solo cambia el piso de las promociones con piso por ticket de ${c.linea}: ${fK(toc)} al mes${c.ya ? ` (ya descontado lo que cambió la parrilla de septiembre)` : ''}. El resto de la inversión no se toca.</div>` + FOOT(c.cat + ' · pisos por ticket · ene–ago 2026'));
}

const ST = {};
function lamina2(ci) {

  sl('l2', ci, `<div class="badge">${c.cat}</div><div class="eyebrow">${c.cat} · 2 · cómo compran y qué piso conviene · boca + oficina + segmento</div>
   <h2 class="t2"></h2>

function filas(ci, f) { const c = D.cats[ci]; return c.rows.filter(r => r.tasa && (f.of === 'Total' || r.of === f.of) && (!f.boca || f.boca === 'Todas' || r.boca === f.boca) && (!f.seg || f.seg === 'Todos' || r.seg === f.seg)); }
function grafico(ci) {

  if (!sum(g.cl)) return '<div class="note">Sin clientes con descuento para este filtro.</div>';
  const C = sum(g.cl), I = sum(g.inv) || 1, CKt = sum(g.ck);

  const mx = Math.max(...t.map(x => Math.max(x.cl, x.v))) || 1, paso = mx > .3 ? .1 : .05, top = Math.ceil(mx / paso) * paso;
  const W = 1200, x0 = 46, y0 = 170, bw = (W - x0 - 10) / t.length, Y = f => y0 - f / top * 132;
  let s = `<svg viewBox="0 0 ${W} 214" style="width:100%;height:auto">`;
  for (let v = 0; v <= top + 1e-9; v += paso) s += `<line x1="${x0}" y1="${Y(v)}" x2="${W}" y2="${Y(v)}" stroke="#EFEBE4"/><text x="${x0 - 8}" y="${Y(v) + 4}" font-size="11" fill="#8A938E" text-anchor="end">${Math.round(v * 100)}%</text>`;
  s += `<line x1="${x0}" y1="${y0}" x2="${x0}" y2="${Y(top)}" stroke="#2D9C9C" stroke-width="2" stroke-dasharray="5 4"/>`;
  const xOf = p => { const j = G2.findIndex((lo, k) => p >= lo && p < G2[k + 1]); return j < 0 ? W - 10 : x0 + j * bw + bw * (p - G2[j]) / (G2[j + 1] - G2[j]); };
  t.forEach((x, j) => { const X = x0 + j * bw + 8, w = bw - 16;
    s += `<rect x="${X}" y="${Y(x.cl)}" width="${w}" height="${y0 - Y(x.cl)}" fill="#2D9C9C" rx="2"/>`;
    s += `<rect x="${X + w * .3}" y="${Y(x.v)}" width="${w * .4}" height="${y0 - Y(x.v)}" fill="#D4A853" rx="2"/>`;
    const yl = Math.min(Y(x.cl), Y(x.v)) - 4;
    s += `<text x="${X + w / 2}" y="${yl - 13}" font-size="11" fill="#5A6560" text-anchor="middle">${Math.round(x.cl * 100)}%</text><text x="${X + w / 2}" y="${yl}" font-size="11" font-weight="700" fill="#2D9C9C" text-anchor="middle">${Math.round(x.t * 100)}%</text>`;
    s += `<text x="${X + w / 2}" y="${y0 + 18}" font-size="11.5" fill="#5A6560" text-anchor="middle">${x.hi > 1e8 ? 'S/' + x.lo + '+' : x.lo === 0 ? '&lt;S/' + x.hi : 'S/' + x.lo + '–' + x.hi}</text>`; });
  const ph = rs.filter(r => r.phoy).map(r => r.phoy[0]), pr = rs.map(r => rec(r)).filter(p => p > 0);
  const pill = (p, txt, col, fila) => { const X = xOf(p), wT = txt.length * 6.6 + 20, xp = Math.min(X + 4, W - wT - 4);
    return `<line x1="${X}" y1="${y0}" x2="${X}" y2="${6 + fila * 22}" stroke="${col}" stroke-width="2" stroke-dasharray="4 3"/><rect x="${xp}" y="${fila * 22}" width="${wT}" height="19" rx="9.5" fill="${col}"/><text x="${xp + 10}" y="${fila * 22 + 13.5}" font-size="11.5" font-weight="700" fill="#fff">${txt}</text>`; };

function pinta2(ci) {

  $('.g2', s).innerHTML = grafico(ci);
  let h = `<thead><tr><th>Segmento · boca</th><th class="num">Piso hoy<br>(según zona)</th><th class="num">Tasa<br>hoy</th><th class="num">Ticket de los que cobran<br>p25 · p50 · p75</th><th class="num">Piso mínimo<br>sugerido</th><th class="num">Clientes retados<br>(de ellos cobraban)</th><th class="num">Pedidos que<br>dejan de cobrar</th><th class="num">Volumen de los<br>retados/mes</th></tr></thead><tbody>`;
  const grupos = {}; rsO.forEach(r => (grupos[r.seg + '|' + r.boca] = grupos[r.seg + '|' + r.boca] || []).push(r));
  Object.entries(grupos).sort((a, b) => sum(b[1].map(r => sum(r.inv))) - sum(a[1].map(r => sum(r.inv)))).forEach(([k, rs]) => {
    const [sg, bo] = k.split('|'), g = juntar(rs), x = evalRows(rs, c, r => rec(r)), on = st.seg === sg && st.boca === bo;
    const tasas = [...new Set(rs.map(r => r.tasa))].sort((a, b) => b - a).map(t => t + '%').join(' / ');
    h += `<tr class="${on ? 'tot' : ''}" style="cursor:pointer" data-sg="${sg}" data-bo="${bo}"><td><b>${sg.replace(/^\d\s*/, '')}</b> · ${bo}</td><td class="num mut">${rngTxt(rs.flatMap(r => r.phoy))}</td><td class="num mut">${tasas}</td><td class="num">S/ ${pctl(g, .25)} · <b>${pctl(g, .5)}</b> · ${pctl(g, .75)}</td><td class="num"><b>${rngTxt(x.pisos)}</b></td>
      <td class="num">${fN(x.cl + x.rn)} <span class="mut">· ${fP(x.cl / ((x.cl + x.rn) || 1), 0)} cobraban</span></td><td class="num">${fN(x.pc / c.M)}/mes <span class="mut">· ${fP(x.pc / (x.P || 1), 0)}</span></td><td class="num">${fKg((x.ck + x.rkn) / c.M)}</td></tr>`; });
  $('.tb2', s).innerHTML = h + '</tbody>';
  $('.tb2', s).querySelectorAll('tr[data-sg]').forEach(tr => tr.onclick = () => { st.seg = tr.dataset.sg; st.boca = tr.dataset.bo; pinta2(ci); });

const S3 = {};
function lamina3(ci) {
  const c = D.cats[ci]; S3[ci] = { of: 'Total', boca: 'todas', esc: 'rec', ed: {} };
  sl('l3', ci, `<div class="badge">${c.cat}</div><div class="eyebrow">${c.cat} · 3 · simulador · boca + oficina + segmento</div><h2>Probar pisos y tasas <em>en vivo</em></h2>
   <div class="kpis k6 kp k3" style="margin:18px 0 18px"></div>
   <div class="gactrl" style="margin:0 0 8px"><span class="ofl">Oficina</span><span class="s-of"></span><span class="ofl" style="margin-left:16px">Boca</span><span class="s-bo"></span><span class="ofl" style="margin-left:16px">Arrancar desde</span><span class="s-es"></span></div>
   <div class="gactrl" style="margin:0 0 12px"><span class="ofl">A las filas visibles</span>piso S/<input class="su g s-gp" type="number" min="0" step="1" placeholder="piso"> tasa <input class="st g s-gt" type="number" min="0" max="10" step="0.5" placeholder="%">%<span class="sab s-ap">aplicar</span><span class="selhint">vacío = no cambia · tasa vacía = la de hoy</span></div>
   <div style="flex:1;min-height:0;overflow:auto;border-top:1px solid var(--line)"><table class="apretada mini tb3"></table></div>` +
   FOOT(`${c.cat} · subir el piso saca a los pedidos de abajo; cambiar la tasa cambia lo que cobran los de arriba · bajar el piso por debajo del de hoy no se simula`));
  pinta3(ci);
  const s = document.querySelectorAll('.slide[data-tipo="l3"]')[ci];
  $('.s-ap', s).onclick = () => { const p = $('.s-gp', s).value, t = $('.s-gt', s).value;
    filas(ci, { of: S3[ci].of, boca: S3[ci].boca === 'todas' ? null : S3[ci].boca }).forEach(r => { const k = r.boca + r.of + r.seg, e = S3[ci].ed[k] || (S3[ci].ed[k] = {}); if (p !== '') e.p = Math.max(0, +p); if (t !== '') e.t = Math.max(0, +t); });

}
function pinta3(ci) {
  const c = D.cats[ci], st = S3[ci], s = document.querySelectorAll('.slide[data-tipo="l3"]')[ci];
  botones($('.s-of', s), [['Total', 'total']].concat(OFS.map(o => [o, o])), st.of, v => { st.of = v; pinta3(ci); });

  const tasaDe = r => { const e = st.ed[r.boca + r.of + r.seg]; return e && e.t != null ? e.t : null; };
  const T = evalRows(rs, c, pisoDe, tasaDe);
  $('.k3', s).innerHTML = kpis(c, T, c.kg[st.of]);
  let h = `<thead><tr><th>Boca · oficina · segmento</th><th class="num">Hoy/mes</th><th class="num">Piso hoy</th><th class="num">Tasa hoy</th><th class="num">Piso</th><th class="num">Tasa %</th><th class="num">Nuevo/mes</th><th class="num">Ahorro/mes</th><th class="num">Clientes retados<br>(de ellos cobraban)</th><th class="num">Pedidos que<br>dejan de cobrar</th><th class="num">Volumen de los<br>retados/mes</th></tr></thead><tbody>`;
  rs.forEach(r => { const k = r.boca + r.of + r.seg, x = evalRows([r], c, pisoDe, tasaDe), t = tasaDe(r);
    h += `<tr data-k="${k}"><td><b>${r.boca} · ${r.of} · ${r.seg.replace(/^\d\s*/, '')}</b></td><td class="num">${fK(x.hoy)}</td><td class="num mut">S/${r.phoy[0]}–${r.phoy[1]}</td><td class="num mut">${r.tasa}%</td>
     <td class="num"><input class="su" data-c="p" type="number" min="0" step="1" value="${pisoDe(r)}"></td><td class="num"><input class="st" data-c="t" type="number" min="0" max="10" step="0.5" value="${t == null ? '' : t}" placeholder="hoy"></td>
     <td class="num">${fK(x.nue)}</td><td class="num ${x.ah >= 0 ? 'hot' : 'warn'}">${fS(x.ah)}</td><td class="num">${fN(x.cl + x.rn)} <span class="mut">· ${fP(x.cl / ((x.cl + x.rn) || 1), 0)} cobraban</span></td><td class="num">${fN(x.pc / c.M)}/mes</td><td class="num">${fKg((x.ck + x.rkn) / c.M)}</td></tr>`; });

// ── armado, navegación y tope ──
let I = 0, SL = [];
function go(n) { I = Math.max(0, Math.min(SL.length - 1, n)); SL.forEach((s, k) => s.classList.toggle('on', k === I)); $('#ix-ov').classList.remove('on'); }

    return `<div class="kpi"><b>${fK(c.total)}</b><span>${c.cat} · inversión/mes</span><small>${fK(T.hoy)} con piso por ticket</small></div><div class="kpi"><b style="color:var(--green)">${fK(T.ah)}</b><span>${c.cat} · ahorro estimado/mes</span><small>tope ${fP(TOPE, 0)} de clientes</small></div>`; }).join('');

function construir() {

  SL = [...document.querySelectorAll('.slide')]; SL.forEach((s, k) => { const n = $('.foot .n', s); if (n) n.textContent = (k + 1) + ' / ' + SL.length; });

document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(I + 1); } if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(I - 1); } });

addEventListener('resize', fit); construir(); pintaTope(); fit();
</script></body></html>
