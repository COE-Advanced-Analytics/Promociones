<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evolución con cortes comparables</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg-cream:#FDFBF7;--bg-warm:#F8F5F0;--bg-card:#FFFFFF;--text-primary:#3D3A36;--text-secondary:#4a4a5a;
--text-muted:#7a7a8a;--coral:#E85D4C;--coral-dark:#C94A3A;--coral-light:#FFF0EE;--teal:#2D9C9C;--teal-dark:#238080;
--teal-light:#E8F6F6;--gold:#D4A853;--gold-dark:#C4983F;--gold-light:#FDF8EC;--purple:#7B5EA7;--purple-light:#F2EEF9;
--blue:#3A7BD5;--blue-light:#E8F0FD;--green:#2E9E6B;--green-light:#E8F7F1;--border:#E8E4DD;
--shadow-sm:0 2px 6px rgba(26,26,46,.07);--shadow-md:0 5px 18px rgba(26,26,46,.12);
--s1:#E85D4C;--s2:#2D9C9C;--s3:#D4A853;--s4:#7B5EA7;--s5:#3A7BD5;--s6:#2E9E6B;--s7:#C2528B;--s8:#7a7a8a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg-cream);color:var(--text-primary);line-height:1.5;overflow-x:hidden}
.wrap{max-width:1320px;margin:0 auto;padding:0 22px 60px}
.area-logo{position:fixed;top:14px;right:22px;display:flex;align-items:center;background:#FAF8F6;
border:1px solid var(--border);border-radius:100px;padding:4px 16px;box-shadow:var(--shadow-sm);z-index:30}
.area-logo img{height:38px;width:auto;display:block;mix-blend-mode:multiply}
.area-logo-name{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;color:var(--text-primary);line-height:1.2;padding:4px 6px}
body{--hero1:#1F3A4D;--hero2:#2D6A7A;--hero3:#D4A853}
body[data-theme="conservas"]{--hero1:#0B6B3A;--hero2:#1B8A4B;--hero3:#C9A55A}
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(115deg,var(--hero1) 0%,var(--hero2) 58%,var(--hero3) 130%);background-size:cover;background-position:center center;background-repeat:no-repeat}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 88% 12%,rgba(255,255,255,.18),transparent 42%),radial-gradient(circle at 6% 118%,rgba(0,0,0,.28),transparent 52%)}
.banner{display:none;width:100%;height:clamp(130px,21vw,270px);object-fit:cover;object-position:center center;background:var(--bg-warm)}
.banner.on{display:block}
.hero.img{background:var(--bg-cream);color:var(--text-primary);text-align:center;border-bottom:1px solid var(--border)}
.hero.img::before{display:none}
.hero.img .hero-inner{padding:6px 22px 30px}
.hero.img .cat-tabs,.hero.img .hero-stats{justify-content:center}
.hero.img .cat-btn{background:#fff;color:var(--text-secondary);border-color:var(--border);backdrop-filter:none}
.hero.img .cat-btn:hover{border-color:var(--hero2);color:var(--hero1)}
.hero.img .cat-btn.on{background:var(--hero1);color:#fff;border-color:var(--hero1);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.hero.img .hero-badge{background:#fff;border-color:var(--border);color:var(--hero1)}
.hero.img .badge-dot{background:var(--hero2)}
.hero.img h1{color:var(--text-primary)}.hero.img h1 .hl{color:var(--hero2)}
.hero.img .sub{color:var(--text-muted);margin-left:auto;margin-right:auto}
.hero.img .stat{background:#fff;border-color:var(--border);box-shadow:var(--shadow-sm);backdrop-filter:none}
.hero.img .stat .n{color:var(--text-primary)}.hero.img .stat .l{color:var(--text-muted)}
.hero-mark{position:absolute;right:14px;bottom:-30px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(80px,14vw,176px);letter-spacing:-5px;line-height:1;color:rgba(255,255,255,.08);pointer-events:none;user-select:none;text-transform:uppercase}
.hero.img .hero-mark{display:none}
.hero-inner{max-width:1320px;margin:0 auto;padding:46px 22px 34px;position:relative;z-index:1}
.cat-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.cat-btn{appearance:none;cursor:pointer;border:1.5px solid rgba(255,255,255,.5);background:rgba(255,255,255,.1);color:#fff;font-family:'Space Grotesk',sans-serif;
font-size:14px;font-weight:700;letter-spacing:.3px;padding:11px 30px;border-radius:100px;transition:all .18s;backdrop-filter:blur(4px)}
.cat-btn:hover{background:rgba(255,255,255,.24)}
.cat-btn.on{background:#fff;color:var(--hero1);border-color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.hero-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);
padding:4px 14px;border-radius:100px;font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;
color:#fff;text-transform:uppercase;letter-spacing:.7px;margin-bottom:14px}
.badge-dot{width:6px;height:6px;background:#FFE2B0;border-radius:50%}
.hero h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(26px,3.8vw,42px);font-weight:700;line-height:1.1;margin-bottom:10px;color:#fff}
.hero h1 .hl{color:#FFE2B0}
.hero .sub{font-size:14px;color:rgba(255,255,255,.84);margin-bottom:24px;max-width:760px}
.hero-stats{display:flex;gap:14px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.26);border-radius:14px;padding:13px 22px 12px;backdrop-filter:blur(6px);min-width:150px}
.stat .n{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;line-height:1;color:#fff}
.stat .l{font-size:10.5px;color:rgba(255,255,255,.78);margin-top:5px;letter-spacing:.3px}
.fbar{position:sticky;top:0;z-index:20;background:rgba(253,251,247,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);margin-bottom:26px}
.fbar-in{max-width:1320px;margin:0 auto;padding:10px 22px 8px}
@media(min-width:901px){.fbar-in{padding-right:250px}}   /* el logo COE es fijo: los filtros no pasan por debajo */
.fbar .fgrid{margin:0;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px 10px}
.section{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-sm);padding:26px 28px;margin-bottom:22px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.sec-num{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;color:#fff;width:26px;height:26px;
border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sec-eyebrow{font-family:'Space Grotesk',sans-serif;font-size:9.5px;font-weight:700;text-transform:uppercase;
letter-spacing:.8px;color:var(--text-muted)}
.section h2{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;line-height:1.2}
.sec-desc{font-size:12.5px;color:var(--text-muted);margin:2px 0 20px 38px}
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:12.5px}
th{background:var(--bg-warm);color:var(--text-primary);padding:9px 11px;text-align:left;
font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;
letter-spacing:.5px;border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--border);color:var(--text-secondary);white-space:nowrap}
tr:last-child td{border-bottom:none}
.n{text-align:right;font-variant-numeric:tabular-nums}
th.n{text-align:right}
td.b,td:first-child{font-weight:700;color:var(--text-primary);font-family:'Space Grotesk',sans-serif}
tr.tot td{background:var(--bg-warm);font-weight:700;color:var(--text-primary)}
.tblwrap{overflow-x:auto}
.warn{color:var(--coral-dark);font-weight:700}
.callout{display:flex;gap:12px;align-items:flex-start;background:var(--gold-light);border-radius:12px;padding:14px 16px;margin-bottom:18px}
.callout[hidden]{display:none}
.callout .cdot{width:22px;height:22px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:1px}
.callout .ctext{font-size:12.5px;color:var(--text-secondary);line-height:1.5}
.callout .ctext b{color:var(--gold-dark);font-weight:700}
.callout.cor{background:var(--coral-light)}.callout.cor .cdot{background:var(--coral)}.callout.cor .ctext b{color:var(--coral-dark)}
.callout.tl{background:var(--teal-light)}.callout.tl .cdot{background:var(--teal)}.callout.tl .ctext b{color:var(--teal-dark)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 14px;margin:6px 0 12px}
.cgrp{display:flex;flex-direction:column;align-items:stretch;gap:4px}
.cgrp .clab{font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:700;text-transform:uppercase;
letter-spacing:.6px;color:var(--text-muted)}
.fsel{appearance:auto;border:1px solid var(--border);background:var(--bg-card);font-family:'DM Sans',sans-serif;font-size:11.5px;
font-weight:500;color:var(--text-secondary);padding:6px 8px;border-radius:8px;width:100%;cursor:pointer;text-overflow:ellipsis}
.fsel:hover{border-color:var(--text-muted)}
.fsel.on{border-color:var(--coral);background:var(--coral-light);color:var(--coral-dark);font-weight:600}
.msel{position:relative}
.msel summary{list-style:none;appearance:none;border:1px solid var(--border);background:var(--bg-card);font-family:'DM Sans',sans-serif;font-size:11.5px;
font-weight:500;color:var(--text-secondary);padding:6px 24px 6px 8px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.msel summary::-webkit-details-marker{display:none}
.msel summary::after{content:'';position:absolute;right:9px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--text-muted);border-bottom:1.5px solid var(--text-muted);transform:translateY(-70%) rotate(45deg)}
.msel summary:hover{border-color:var(--text-muted)}
.msel.on summary{border-color:var(--coral);background:var(--coral-light);color:var(--coral-dark);font-weight:600}
.mpanel{position:absolute;top:calc(100% + 4px);left:0;min-width:100%;width:max-content;max-width:260px;z-index:50;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-md);padding:6px;max-height:280px;overflow:auto}
.mopt{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;font-size:12px;color:var(--text-secondary);cursor:pointer;white-space:nowrap}
.mopt:hover{background:var(--bg-warm)}
.mopt input{accent-color:var(--coral);cursor:pointer}
.mclr{display:block;width:100%;text-align:left;appearance:none;border:0;background:transparent;font:600 11px 'DM Sans',sans-serif;color:var(--coral-dark);padding:5px 8px;cursor:pointer;border-bottom:1px solid var(--border);margin-bottom:3px}
.btn{appearance:none;border:1px solid var(--border);background:var(--bg-card);cursor:pointer;font-family:'DM Sans',sans-serif;
font-size:11.5px;font-weight:600;color:var(--text-secondary);padding:6px 10px;border-radius:8px}
.btn:hover{border-color:var(--text-muted)}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--bg-warm);border:1px solid var(--border);border-radius:100px;padding:3px;width:fit-content;max-width:100%}
.seg button{appearance:none;border:0;background:transparent;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;
color:var(--text-secondary);padding:6px 14px;border-radius:100px;transition:all .15s;white-space:nowrap}
.seg button:hover{background:#fff;color:var(--text-primary)}
.seg button.on{background:var(--coral);color:#fff;box-shadow:var(--shadow-sm)}
.fgrid.segs{display:flex;flex-wrap:wrap;gap:8px 24px}
.calwrap{display:flex;gap:18px;align-items:flex-start;margin-top:6px}
.calwrap .tblwrap{flex:1;min-width:0}
.calside{flex:0 0 306px}
table.cal{border-collapse:separate;border-spacing:3px;table-layout:fixed;width:100%;margin:0;font-size:11px}
table.cal th{padding:7px 0;text-align:center;font-size:10.5px;letter-spacing:0;border-bottom:0;background:var(--bg-warm);border-radius:4px}
table.cal th.m{width:58px;text-align:left;padding-left:8px;background:transparent}
table.cal td{padding:15px 0;text-align:center;border:1px solid var(--border);border-radius:6px;background:#fff;
font-family:'DM Sans',sans-serif;font-weight:500;font-size:11px;color:var(--text-primary);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
table.cal.sm td{font-size:10px;letter-spacing:-.3px}
table.cal td.m{border:0;background:transparent;text-align:left;padding-left:8px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11px}
table.cal td.d3{background:#CFEBD3;border-color:#A9D8B0}
table.cal td.d6{background:#FADCD2;border-color:#F0B9A6}
table.cal td.dom{background:#E8E8E8;border-color:#D8D8D8;color:var(--text-muted)}
table.cal td.na{border-color:transparent;background:transparent}
table.cal td.domp{background:#F6F6F6;border-color:#E9E9E9;color:var(--text-secondary)}
table.cal.wk{margin:0}
table.cal.wk th.m{width:50px}
table.cal.wk td.sw{background:#fff;border-color:var(--border);font-weight:600;font-size:11px}
table.cal.sm.wk td.sw{font-size:10.5px}
.cleg{display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px;font-size:11px;color:var(--text-secondary);border:1px solid var(--border);border-radius:9px;padding:8px 14px;background:var(--bg-warm);margin-top:12px;width:fit-content;max-width:100%}
.cleg b{font-family:'Space Grotesk',sans-serif;font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted)}
.cleg .it{display:flex;align-items:center;gap:7px;line-height:1.2}
.cleg .sw{width:13px;height:13px;border-radius:3px;border:1px solid var(--border);flex-shrink:0;background:#fff}
.cleg .sw.d3{background:#CFEBD3;border-color:#A9D8B0}.cleg .sw.d6{background:#FADCD2;border-color:#F0B9A6}.cleg .sw.dom{background:#E8E8E8;border-color:#D8D8D8}
.cleg .sw.domp{background:#F6F6F6;border-color:#E9E9E9;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--text-primary)}
.up{color:var(--green);font-weight:700}.dn{color:var(--coral-dark);font-weight:700}
@media(max-width:1100px){.calwrap{flex-direction:column}.calside{flex:none;width:100%}}
.chlab{display:flex;gap:6px 10px;flex-wrap:wrap;margin:8px 0 4px;font-size:10.5px;color:var(--text-muted);align-items:center}
.schip{appearance:none;border:1px solid var(--border);background:var(--bg-card);cursor:pointer;display:inline-flex;align-items:center;gap:7px;
font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:500;color:var(--text-secondary);padding:4px 12px;border-radius:100px;transition:all .15s}
.schip:hover{border-color:var(--text-muted)}
.schip.off{opacity:.42}
.schip.static{cursor:default}
.key{display:inline-block;width:16px;height:0;border-top:3px solid;border-radius:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:11px;margin:0 0 22px}
.kpi{background:var(--bg-warm);border:1px solid var(--border);border-radius:11px;padding:12px 14px}
.kpi .kl{font-size:9.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;font-family:'Space Grotesk',sans-serif;font-weight:700}
.kpi .kv{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;margin-top:4px}
.kpi .ks{font-size:10.5px;color:var(--text-muted);margin-top:2px;line-height:1.45}
.kpi.big{background:var(--green-light);border-color:#BFE6D4}
.kpi.big .kv{color:var(--green);font-size:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin:14px 0}
.chartbox{position:relative;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:12px 8px 6px}
.ctitle{font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:700;color:var(--text-primary);margin:0 0 2px 8px}
svg.chart{width:100%;height:auto;display:block;outline:none;overflow:visible}
svg.chart:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg text{font:10.5px 'DM Sans',system-ui,sans-serif;fill:var(--text-muted)}
.tip{position:fixed;pointer-events:none;background:var(--text-primary);color:#fff;border-radius:10px;padding:10px 12px;
font-size:11px;line-height:1.5;box-shadow:var(--shadow-md);z-index:40;min-width:190px}
.tip .hd{font-family:'Space Grotesk',sans-serif;font-size:11.5px;font-weight:700;margin-bottom:5px}
.tip .row{display:flex;align-items:center;gap:14px;justify-content:space-between}
.tip .row span.l{display:flex;align-items:center;gap:6px;color:#B9B4AC}
.tip .row b{font-family:'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums;color:#fff}
.foot{text-align:center;font-size:11px;color:var(--text-muted);margin-top:28px;padding-top:18px;border-top:1px solid var(--border)}
.err{background:#fde8e8;color:#8a1c1c;padding:10px;border-radius:6px;margin:10px 22px}
.btn-det{border-color:var(--hero2);color:var(--hero1);background:#fff;padding:7px 16px;border-radius:100px;font-size:12px;font-weight:700}
.btn-det:hover{background:var(--hero1);color:#fff;border-color:var(--hero1)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(30,26,22,.55);display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px)}
.modal[hidden]{display:none}
.mbox{background:var(--bg-card);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(1180px,100%);max-height:calc(100vh - 48px);display:flex;flex-direction:column;overflow:hidden}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:20px 26px 12px}
.mhead h2{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;line-height:1.25}
.mclose{appearance:none;border:0;background:var(--bg-warm);width:32px;height:32px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;color:var(--text-secondary);flex-shrink:0}
.mclose:hover{background:var(--border)}
.mctl{display:flex;gap:12px 18px;flex-wrap:wrap;align-items:center;padding:0 26px 10px}
.mctl .seg button{font-size:11.5px;padding:5px 12px}
.mctl .seg button i{font-style:normal;opacity:.65;font-weight:500;margin-left:5px;font-size:10.5px}
.mq{border:1px solid var(--border);border-radius:100px;padding:6px 14px;font:500 12px 'DM Sans',sans-serif;width:170px;color:var(--text-secondary)}
.msum{padding:0 26px 8px;font-size:12px;color:var(--text-muted)}
.msum b{color:var(--text-primary);font-weight:700}
.mtbl{overflow:auto;padding:0 26px;flex:1;min-height:120px}
.mtbl table{margin:0;font-size:12px}
.mtbl th{position:sticky;top:0;z-index:1;cursor:pointer;user-select:none}
.mtbl th:hover{color:var(--coral-dark)}
.mtbl td{padding:7px 10px}
.mfoot{padding:10px 26px 16px;font-size:11px;color:var(--text-muted)}
@media(max-width:900px){.fbar{position:static}}
@media(max-width:720px){.area-logo{display:none}.section{padding:20px 16px}.sec-desc{margin-left:0}}
</style>
</head>
<body>
<div class="area-logo" id="logo"></div>

<header class="hero" id="hero"><div class="hero-inner">
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>
</div></header>

<div class="fbar"><div class="fbar-in">
  <div class="fgrid" id="filtros"></div>
</div></div>

<div class="wrap">
<div class="callout cor" id="aviso" hidden><div class="cdot"></div><div class="ctext" id="aviso_t"></div></div>

<div class="kpis" id="kpis"></div>

<section class="section">
  <div class="sec-head"><div class="sec-num" style="background:var(--teal)">1</div>
  <div><div class="sec-eyebrow">Calendario</div><h2 id="cal_titulo">Calendario</h2></div></div>
  <div class="calwrap"><div class="tblwrap"><table class="cal" id="cal"></table></div><div class="calside"><table class="cal wk" id="cal_wk"></table></div></div>
  <div class="cleg" id="cal_leg"></div>
</section>

<section class="section">
  <div class="sec-head"><div class="sec-num" style="background:var(--gold)">2</div>

const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k === 'class') e.className = attrs[k];
    else if(k === 'text') e.textContent = attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for(const c of kids.flat()) if(c != null) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
function sv(tag, attrs, ...kids){
  const e = document.createElementNS(NS, tag);
  if(attrs) for(const k in attrs){
    if(k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]);
  }
  for(const c of kids.flat()) if(c != null) e.append(c);
  return e;
}

/* ---------- formatos ---------- */
const fmtN = (v,d=0) => v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const ab = (v,d=0) => { const a = Math.abs(v);
  if(a >= 1e6) return fmtN(v/1e6,2)+' M';
  if(a >= 1e3) return fmtN(v/1e3, a >= 1e5 ? 0 : 1)+' K';
  return fmtN(v,d); };

const dv = v => Math.abs(v) < 1 ? 2 : Math.abs(v) < 10 ? 1 : 0;      // volumen: enteros, salvo valores chicos (segmentos pequeños) que llevan decimales
const MET = [
  {k:'vol', adit:true, fp:v=>fmtN(v,1)+' kg', tp:(v,d)=>fmtN(v,d), t:'Volumen (tn)',              f:v=>fmtN(v,dv(v))+' tn',          tick:(v,d)=>ab(v,d), zero:true, c:v=>fmtN(v,dv(v))},
  {k:'vl',  adit:true, fp:v=>'S/ '+fmtN(v,2), tp:(v,d)=>fmtN(v,d), t:'Monto neto',                f:v=>Math.abs(v) >= 1e6 ? 'S/ '+fmtN(v/1e6,2)+' M' : 'S/ '+fmtN(v,0), tick:(v,d)=>ab(v,d), zero:true, c:v=>String(Math.round(v/1e3))},   // vl = monto neto: suma de todas las líneas
  {k:'tk',  t:'Ticket (S/ por pedido)',    f:v=>'S/ '+fmtN(v,0),             tick:(v,d)=>fmtN(v,d), calc:r=>r.ped ? r.vl/r.ped : null, c:v=>fmtN(v,0)},
  {k:'cli', t:'CcC',                       f:v=>fmtN(v,0),                   tick:(v,d)=>ab(v,d), zero:true, c:v=>fmtN(v/1e3,1)},
  {k:'mix', t:'Mix SKU por cliente',         f:v=>fmtN(v,1),                   tick:(v,d)=>fmtN(v,d), zero:false, c:v=>fmtN(v,1), sinDia:true},   // promedio de SKU distintos por cliente
];
const mv = (m,r) => { if(r == null) return null; let v = m.calc ? m.calc(r) : r[m.k];
  if(v != null && m.adit && st.modo === 'prom'){ v = v / r.cd; if(m.k === 'vol') v *= 1000; }   // promedio por cliente-día (volumen en kg)
  return (v == null || !isFinite(v)) ? null : v; };
const sfx = () => st.modo === 'prom' ? ' · prom. por cliente-día' : '';
const mt = m => (st.modo === 'prom' && m.k === 'vol' ? 'Volumen (kg)' : m.t) + (m.adit ? sfx() : '');
const fmtOf = m => (m.adit && st.modo === 'prom') ? m.fp : m.f;
const tickOf = m => (m.adit && st.modo === 'prom') ? m.tp : m.tick;

/* ---------- datos ---------- */
let W, NW, LY, IMES, NMESES, IPREV, NDIM, BOCA, CANAL, NCAT, NMK, MKC, DIMX, CATD, MARD, P, NP, PD, C, NC, DY, ND, MS, PCAT, PMK, PEDIDO, NOF, CL, NCL, MCOLS;      // se llenan en cargarDatos()
const isAnio = i => W[i].tipo === 'anio';
function cargarDatos(Dn){            // (re)arma todo lo que depende de los datos; se llama con los de facturación y, si se pide, con los de pedido
  D = Dn;
  W = D.ventanas; NW = W.length;
  LY = -1; W.forEach((w,i)=>{ if(w.tipo === 'anio') LY = i; });
  IMES = []; W.forEach((w,i)=>{ if(w.tipo === 'mes') IMES.push(i); });          // meses anteriores: su promedio es la referencia «vs prom.»
  NMESES = IMES.length; IPREV = NMESES ? IMES[NMESES-1] : -1;      // IPREV = mes anterior inmediato
  W.forEach(w=>{ w.inc = w.tipo === 'actual' && !!(w.fecha_max && w.fecha_max < w.fin); });   // solo el corte actual: en otros meses un día final sin venta es normal
  NDIM = D.dims.length; BOCA = D.dims.findIndex(d => d.key === 'boca'); CANAL = D.dims.findIndex(d => d.key === 'canal');
  NCAT = D.cats.length; NMK = D.marcas.length; MKC = D.marca_cat;                 // marca: cada una pertenece a una categoría (MKC = índice de su categoría)
  DIMX = [...D.dims, {key:'categoria', label:'Categoría', valores:D.cats}, {key:'marca', label:'Marca', valores:D.marcas}]; CATD = NDIM; MARD = NDIM + 1;      // CATD / MARD = «abrir por categoría / marca»
  P = D.perfiles; NP = P.length;                       // perfil = [boca, canal (-1 = todos), segmento transaccional, segmento estratégico]
  PD = D.dims.map((_,k) => Int16Array.from(P, p => p[k]));
  C = D.celdas; NC = C.w.length;
  DY = D.dias; ND = DY.d.length; MS = D.meses;                  // ventas por día (calendario)
  PCAT = new Uint8Array(NP*NCAT); PMK = new Uint8Array(NP*Math.max(NMK,1));      // categorías y marcas presentes en cada perfil
  for(let i=0;i<NC;i++){ if(C.c[i] >= 0) PCAT[C.p[i]*NCAT + C.c[i]] = 1; if(C.mk[i] >= 0) PMK[C.p[i]*NMK + C.mk[i]] = 1; }
  PEDIDO = D.meta.fecha_base === 'pedido';
  NOF = new Array(NDIM).fill(-1);
  CL = D.clientes; NCL = CL ? CL.cod.length : 0;
  MCOLS = [['cod','Cliente',0],['boca','Boca',1],['segmento','Seg. trans.',1],['seg_estrat','Seg. estr.',1],
           ['va','Vol. '+W[NW-1].etiqueta,2],['vp','Prom. '+NMESES+'M',2],['d','Var. abs.',2],['r','Var. %',2]];
}

/* un filtro es un valor (-1 = todos) o, en boca, un conjunto de valores (vacío = todos) */
const fAct = f => f instanceof Set ? f.size > 0 : f >= 0;
const fHas = (f,v) => f instanceof Set ? (!f.size || f.has(v)) : (f < 0 || f === v);

/* perfiles que cumplen los filtros F. Al abrir por canal se usan las filas por canal; si no, la regla del filtro de canal
   (-1 = filas «todos los canales», que ya traen los clientes sin duplicar) */
function perfOk(F, dimAbre){
  const ok = new Uint8Array(NP);
  for(let p=0;p<NP;p++){
    let good = true;
    for(let k=0;k<NDIM;k++){
      if(k === CANAL){
        const c = PD[CANAL][p];
        if(dimAbre === CANAL){ if(c < 0 || (F[CANAL] >= 0 && c !== F[CANAL])){ good = false; break; } }
        else if(c !== F[CANAL]){ good = false; break; }
      } else if(!fHas(F[k], PD[k][p])){ good = false; break; }
    }
    ok[p] = good ? 1 : 0;
  }
  return ok;
}
const NM = 7;       // vol, vl, inv, ped, cli, cd (clientes-día), mxs (suma de SKU distintos por cliente)
function aggregate(F, cat, dimAbre, mk = -1){
  const ok = perfOk(F, dimAbre >= NDIM ? -1 : dimAbre), groups = new Map();
  for(let i=0;i<NC;i++){
    const ci = C.c[i], mi = C.mk[i];
    if(dimAbre === CATD){ if(ci < 0 || (cat >= 0 && ci !== cat) || (mk >= 0 ? mi !== mk : mi >= 0)) continue; }      // por categoría: solo filas de categoría específica
    else if(dimAbre === MARD){ if(mi < 0 || (mk >= 0 && mi !== mk) || (cat >= 0 && ci !== cat)) continue; }          // por marca: solo filas de marca (que ya traen su categoría)
    else if(mk >= 0){ if(mi !== mk || (cat >= 0 && ci !== cat)) continue; }                                           // marca elegida: filas de esa marca
    else if(mi >= 0 || ci !== cat) continue;                                                                        // cat = -1: filas «todas las categorías»
    const p = C.p[i]; if(!ok[p]) continue;
    const key = dimAbre < 0 ? 0 : dimAbre === CATD ? ci : dimAbre === MARD ? mi : PD[dimAbre][p];
    let g = groups.get(key); if(!g){ g = new Float64Array(NW*NM); groups.set(key,g); }
    const o = C.w[i]*NM;
    g[o] += C.vol[i]; g[o+1] += C.vl[i]; g[o+2] += C.inv[i]; g[o+3] += C.ped[i]; g[o+4] += C.cli[i]; g[o+5] += C.cd[i]; if(C.mxs) g[o+6] += C.mxs[i];
  }
  return groups;
}
function build(F, cat, dimAbre, mk = -1){     // grupo -> [registro por ventana]
  const groups = aggregate(F, cat, dimAbre, mk), out = new Map();
  groups.forEach((g,key)=>{
    const recs = [];
    for(let w=0; w<NW; w++){
      const o = w*NM;
      recs.push((g[o+1] || g[o+2] || g[o+3]) ? {vol:g[o], vl:g[o+1], inv:g[o+2], ped:g[o+3], cli:g[o+4], mix:(C.mxs && g[o+4]) ? g[o+6]/g[o+4] : null, cd:g[o+5]} : null);
    }
    out.set(key, recs);
  });
  return out;
}
const NMD = 5;      // vol, vl, inv, ped, cli (por día)
function diario(F, cat, mk = -1){              // [mes][día] -> registro (o null) con los filtros F
  const ok = perfOk(F, -1), res = MS.map(m => new Float64Array(33*NMD));
  for(let i=0;i<ND;i++){
    if(!ok[DY.p[i]]) continue;
    if(mk >= 0){ if(DY.mk[i] !== mk || (cat >= 0 && DY.c[i] !== cat)) continue; }
    else if(DY.mk[i] >= 0 || DY.c[i] !== cat) continue;
    const g = res[DY.m[i]], o = DY.d[i]*NMD;
    g[o] += DY.vol[i]; g[o+1] += DY.vl[i]; g[o+2] += DY.inv[i]; g[o+3] += DY.ped[i]; g[o+4] += DY.cli[i];
  }
  return res.map(g => Array.from({length:33}, (_,d)=>{ const o = d*NMD;
    return (g[o+1] || g[o+2] || g[o+3]) ? {vol:g[o], vl:g[o+1], inv:g[o+2], ped:g[o+3], cli:g[o+4], cd:g[o+4], mix:null} : null; }));
}

/* ---------- estado y filtros ---------- */
const sumVl = recs => recs ? recs.reduce((s,r)=> s + (r ? r.vl : 0), 0) : 0;
const ORDEN_BOCA = ['BO','PM','MM','MA','B2B'];       // boca: siempre BO, PM, MM · segmentos: siempre en su orden (1 Oro+ … Por definir al final)
const SIN_SEG = /^(por definir|sin dato|sin segment)/i;
const ordenFijo = (k,v) => { const d = D.dims[k]; if(!d) return null;
  if(d.key === 'boca') return ORDEN_BOCA.indexOf(d.valores[v]) + 1 || 99;
  if(d.key === 'segmento' || d.key === 'seg_estrat') return (SIN_SEG.test(d.valores[v]) ? 1000 : 0) + v;
  return null; };
const st = {f:[], cat:-1, marca:-1, dim:0, met:'vol', modo:'total'};   // por defecto: todas las categorías, volumen, abierto por boca
function aplicarEstado(q){            // q: URLSearchParams con los filtros por NOMBRE (hash inicial, o los que se conservan al cambiar de fecha)
  st.f = NOF.slice(); st.f[BOCA] = new Set(); st.cat = -1; st.marca = -1; st.dim = BOCA;      // boca: selección múltiple
  D.dims.forEach((dm,k)=>{ if(!q.has('d'+k)) return;
    const vs = q.get('d'+k).split('|').map(n=>dm.valores.indexOf(n)).filter(v=>v >= 0);
    if(k === BOCA) vs.forEach(v=>st.f[k].add(v)); else if(vs.length) st.f[k] = vs[0]; });
  if(q.has('cat')){ const c = D.cats.indexOf(q.get('cat')); if(c >= 0) st.cat = c; }
  if(q.has('marca')){ const c = D.marcas.indexOf(q.get('marca')); if(c >= 0) st.marca = c; }
  if(q.has('dim')){ const key = q.get('dim'), j = DIMX.findIndex(d=>d.key === key); if(key === 'total') st.dim = -1; else if(j >= 0) st.dim = j; }
  if(q.has('met') && MET.some(m=>m.k === q.get('met') && !m.sinDia)) st.met = q.get('met');
  if(q.has('modo')) st.modo = q.get('modo') === 'prom' ? 'prom' : 'total';
}
function estadoHash(){
  const q = new URLSearchParams();
  D.dims.forEach((dm,k)=>{ const f = st.f[k];
    if(f instanceof Set){ if(f.size) q.set('d'+k, [...f].map(v=>dm.valores[v]).join('|')); } else if(f >= 0) q.set('d'+k, dm.valores[f]); });
  if(st.cat >= 0) q.set('cat', D.cats[st.cat]);
  if(st.marca >= 0) q.set('marca', D.marcas[st.marca]);
  q.set('dim', st.dim < 0 ? 'total' : DIMX[st.dim].key); q.set('met', st.met); q.set('modo', st.modo);
  return q.toString();
}

const nombreVal = (k,v) => DIMX[k].valores[v];   // boca de salida se muestra con su código: BO, MM, PM

function perfMatchExcept(skip){       // perfiles (con canal específico) que cumplen todos los filtros salvo uno
  const ok = new Uint8Array(NP);
  for(let p=0;p<NP;p++){
    if(PD[CANAL][p] < 0) continue;
    let good = true;
    for(let j=0;j<NDIM;j++) if(j !== skip && !fHas(st.f[j], PD[j][p])){ good = false; break; }
    if(good && skip !== 'cat' && st.cat >= 0 && !PCAT[p*NCAT + st.cat]) good = false;
    if(good && skip !== 'marca' && st.marca >= 0 && !PMK[p*NMK + st.marca]) good = false;
    ok[p] = good ? 1 : 0;
  }
  return ok;
}
function disponibles(k){
  const ok = perfMatchExcept(k), s = new Set();
  for(let p=0;p<NP;p++) if(ok[p]) s.add(PD[k][p]);
  return s;
}
function catsDisponibles(){
  const ok = perfMatchExcept('cat'), s = new Set();
  for(let p=0;p<NP;p++) if(ok[p]) for(let c=0;c<NCAT;c++) if(PCAT[p*NCAT + c] && (st.marca < 0 || MKC[st.marca] === c)) s.add(c);
  return s;
}
function marcasDisponibles(){          // marcas con venta en los demás filtros; si hay categoría, solo las de esa categoría
  const ok = perfMatchExcept('marca'), s = new Set();
  for(let p=0;p<NP;p++) if(ok[p]) for(let m=0;m<NMK;m++) if(PMK[p*NMK + m] && (st.cat < 0 || MKC[m] === st.cat)) s.add(m);
  return s;
}
function normalizar(){                // si un filtro quedó sin datos con la nueva combinación, vuelve a «todos»
  for(let it=0; it<3; it++){
    let ch = false;
    for(let k=0;k<NDIM;k++){ const f = st.f[k]; if(!fAct(f)) continue;
      const av = disponibles(k);
      if(f instanceof Set){ for(const v of [...f]) if(!av.has(v)){ f.delete(v); ch = true; } }
      else if(!av.has(f)){ st.f[k] = -1; ch = true; } }
    if(st.cat >= 0 && !catsDisponibles().has(st.cat)){ st.cat = -1; ch = true; }
    if(st.marca >= 0 && !marcasDisponibles().has(st.marca)){ st.marca = -1; ch = true; }
    if(!ch) break;
  }
}

let TOT = null, GRP = null, DIAS = null;
function calcular(){
  TOT = build(st.f, st.cat, -1, st.marca).get(0) || new Array(NW).fill(null);
  GRP = st.dim >= 0 ? build(st.f, st.cat, st.dim, st.marca) : null;
  DIAS = diario(st.f, st.cat, st.marca);
}

/* ---------- deltas ---------- */
function delta(m,a,b){
  if(a == null || b == null) return '–';
  if(m.k === 'ip'){ const d = a-b; return (d>=0?'▲ +':'▼ ')+fmtN(d,1)+' pp'; }
  if(b === 0) return '–';
  const d = (a/b-1)*100; return (d>=0?'▲ +':'▼ ')+fmtN(d,1)+'%';
}

/* ---------- render ---------- */
const SEL = {};
function poblar(s, opts, val){
  s.replaceChildren(...opts.map(([v,t]) => h('option',{value:v,text:t})));
  s.value = String(val);
  s.classList.toggle('on', val !== -1);
}
function segCtl(box, label, opts, get, set){
  const w = h('div',{class:'seg',role:'group','aria-label':label});
  const pintar = () => w.querySelectorAll('button').forEach((b,i)=> b.classList.toggle('on', String(opts()[i][0]) === String(get())));
  const arma = () => { w.replaceChildren(...opts().map(([v,t])=> h('button',{type:'button',text:t,onclick:()=>{ set(v); pintar(); }}))); pintar(); };
  arma();
  box.append(h('div',{class:'cgrp'}, h('span',{class:'clab',text:label}), w));
  return pintar;
}
function multiSel(box, key, label, k){          // desplegable con casillas (selección múltiple)
  const det = h('details',{class:'msel'}), sum = h('summary',{}), panel = h('div',{class:'mpanel'});
  det.append(sum, panel);
  document.addEventListener('click', e=>{ if(det.open && !det.contains(e.target)) det.open = false; });
  SEL[key] = {k, det, sum, panel};
  box.append(h('div',{class:'cgrp'}, h('span',{class:'clab',text:label}), det));
}
function poblarMulti(m){
  const k = m.k, f = st.f[k];
  const av = [...disponibles(k)].sort((a,b)=> ordenFijo(k,a) != null ? ordenFijo(k,a) - ordenFijo(k,b) : nombreVal(k,a).localeCompare(nombreVal(k,b),'es'));
  m.panel.replaceChildren(h('button',{class:'mclr',type:'button',text:'Todos (limpiar selección)',onclick:()=>{ f.clear(); actualizar(); }}),
    ...av.map(v=> h('label',{class:'mopt'},
      h('input',{type:'checkbox', ...(f.has(v) ? {checked:''} : {}), onchange:e=>{ if(e.target.checked) f.add(v); else f.delete(v); actualizar(); }}), nombreVal(k,v))));
  const sel = [...f].sort((a,b)=>ordenFijo(k,a)-ordenFijo(k,b)).map(v=>nombreVal(k,v));
  m.sum.textContent = !sel.length ? 'Todos' : sel.length <= 3 ? sel.join(', ') : sel.length+' seleccionados';
  m.det.classList.toggle('on', sel.length > 0);
}
const ACT = {fecha:'facturacion'};      // fecha base activa
const HQ = new URLSearchParams(location.hash.slice(1));      // estado inicial opcional: #fecha=pedido&d0=BO|PM&cat=Salsas&marca=…&dim=boca&met=tk
let UI = false, AVISO_PEND = null;
function aviso(titulo, txt, err){ const a = $('#aviso'); a.classList.toggle('cor', !!err); $('#aviso_t').replaceChildren(h('b',{text:titulo+' '}), txt); a.hidden = false; }
const CARGADOS = {};
function cargarArchivo(fecha, ok, err){      // cada archivo define window.__D['<fecha base>']
  const arch = (D0.meta.archivos || {})[fecha];
  if(CARGADOS[fecha]) return ok(CARGADOS[fecha]);
  if(!arch) return err('No hay archivo de datos para '+fecha+'.');
  const sc = document.createElement('script');
  sc.src = arch+'?v='+encodeURIComponent(D0.meta.corte || '');
  sc.onload = ()=>{
    const d = (window.__D || {})[fecha]; sc.remove(); delete window.__D;
    if(!d) return err('El archivo '+arch+' no trae los datos esperados.');
    if(d.meta.corte !== D0.meta.corte) return err('El archivo '+arch+' es de otro corte ('+d.meta.corte+') y este reporte es del '+D0.meta.corte+'. Genera los dos archivos con el notebook el mismo día.');
    Object.keys(CARGADOS).forEach(k=> delete CARGADOS[k]); CARGADOS[fecha] = d; ok(d);       // solo se conserva el activo
  };
  sc.onerror = ()=>{ sc.remove(); err('No se encontró '+arch+' junto a este archivo.'); };
  document.head.append(sc);
}
function irA(fecha){            // cambia de fecha base en la misma página, conservando los filtros (por nombre)
  aviso('Cargando', 'datos por fecha de '+(fecha === 'pedido' ? 'pedido' : 'facturación')+'…', false);
  const q = UI ? new URLSearchParams(estadoHash()) : HQ;
  cargarArchivo(fecha, d=>{
    ACT.fecha = fecha; $('#aviso').hidden = true;
    cargarDatos(d); aplicarEstado(q);
    $('#sub').textContent = D.meta.subtitulo; document.title = D.meta.titulo;
    if(!UI){ UI = true; iniciarFiltros(); }
    SEL.fecha.value = fecha; SEL.fecha.classList.toggle('on', fecha !== 'facturacion');
    renderVentanas(); actualizar();
    if(AVISO_PEND){ aviso('Aviso.', AVISO_PEND, true); AVISO_PEND = null; }
  }, msg=>{
    if(!UI && fecha === 'pedido'){ AVISO_PEND = msg; irA('facturacion'); return; }      // primer arranque: sin pedido se abre por facturación
    aviso('No se pudo cargar.', msg, true);
    if(SEL.fecha) SEL.fecha.value = ACT.fecha;
  });
}
function iniciarFiltros(){
  const f = $('#filtros');
  const mk = (key,label,fn,box) => {
    const s = h('select',{class:'fsel'}); s.addEventListener('change',()=>fn(+s.value));
    SEL[key] = s; (box || f).append(h('div',{class:'cgrp'}, h('span',{class:'clab',text:label}), s));
  };
  mk('cat','Categoría', v=>{ st.cat = v; actualizar(); });
  mk('marca','Marca', v=>{ st.marca = v; actualizar(); });
  D.dims.forEach((dm,k)=> k === BOCA ? multiSel(f, 'd'+k, dm.label, k) : mk('d'+k, dm.label, v=>{ st.f[k] = v; actualizar(); }));
  { const s = h('select',{class:'fsel'});
    [['facturacion','Facturación'],['pedido','Pedido']].forEach(([v,t])=> s.append(h('option',{value:v,text:t})));
    s.addEventListener('change',()=> irA(s.value)); SEL.fecha = s;
    f.insertBefore(h('div',{class:'cgrp'}, h('span',{class:'clab',text:'Fecha'}), s), f.firstChild); }
  { const s = h('select',{class:'fsel'});
    MET.filter(m=>!m.sinDia).forEach(m=> s.append(h('option',{value:m.k,text:m.t}))); s.value = st.met;   // Mix SKU solo como KPI (no se calcula por día)
    s.addEventListener('change',()=>{ st.met = s.value; renderTodo(); });
    SEL.met = s; f.insertBefore(h('div',{class:'cgrp'}, h('span',{class:'clab',text:'Métrica'}), s), f.firstChild); }
  segCtl($('#filtros_dim'),'Abrir por',()=>[[-1,'Total'], [CATD,'Categoría'], [MARD,'Marca'], ...D.dims.map((d,i)=>[i,d.label])],()=>st.dim,v=>{ st.dim = +v; actualizar(); });
  if(NCL){
    $('#filtros_dim').append(h('div',{class:'cgrp'}, h('span',{class:'clab',text:' '}), h('button',{class:'btn btn-det',type:'button',text:'Detalle clientes',onclick:abrirModal})));
    $('#m_x').addEventListener('click', cerrarModal);
    $('#modal').addEventListener('mousedown', e=>{ if(e.target === $('#modal')) cerrarModal(); });
    document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && !$('#modal').hidden) cerrarModal(); });
  }
  { const s = h('select',{class:'fsel'});
    [['total','Total (suma de clientes)'],['prom','Promedio por cliente por día']].forEach(([v,t])=> s.append(h('option',{value:v,text:t})));
    s.value = st.modo; s.classList.toggle('on', st.modo !== 'total');
    s.addEventListener('change',()=>{ st.modo = s.value; s.classList.toggle('on', st.modo !== 'total'); renderTodo(); });
    SEL.modo = s; f.append(h('div',{class:'cgrp'}, h('span',{class:'clab',text:'Cifras'}), s)); }
  f.append(h('div',{class:'cgrp'}, h('span',{class:'clab',text:' '}),
    h('button',{class:'btn',type:'button',text:'Limpiar filtros',onclick:()=>{ st.f = NOF.slice(); st.f[BOCA] = new Set(); st.cat = -1; st.marca = -1; actualizar(); }})));
}
function refrescarFiltros(){
  D.dims.forEach((dm,k)=>{
    if(k === BOCA){ poblarMulti(SEL['d'+k]); return; }
    const av = [...disponibles(k)].sort((a,b)=> ordenFijo(k,a) != null ? ordenFijo(k,a) - ordenFijo(k,b) : nombreVal(k,a).localeCompare(nombreVal(k,b),'es'));
    poblar(SEL['d'+k], [[-1,'Todos'], ...av.map(v=>[v, nombreVal(k,v)])], st.f[k]);
  });
  const cs = [...catsDisponibles()].sort((a,b)=> D.cats[a].localeCompare(D.cats[b],'es'));
  poblar(SEL.cat, [[-1,'Todas'], ...cs.map(c=>[c, D.cats[c]])], st.cat);
  const ms = [...marcasDisponibles()].sort((a,b)=> D.marcas[a].localeCompare(D.marcas[b],'es'));
  poblar(SEL.marca, [[-1,'Todas'], ...ms.map(m=>[m, D.marcas[m]])], st.marca);
}
const metSel = () => MET.find(m=>m.k === st.met && !m.sinDia) || MET[0];
function prom3(m, v){                 // promedio de los meses anteriores al corte (mismo corte de días)
  const xs = IMES.map(i=>v[i]).filter(x=>x != null);
  return xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : null;
}
const dabs = (m,a,b) => { if(a == null || b == null) return h('span',{text:'–'});       // variación absoluta (en la unidad de la métrica)
  const d = a-b; return h('span',{class: d > 0 ? 'up' : d < 0 ? 'dn' : '', text:(d > 0 ? '▲ +' : d < 0 ? '▼ −' : '')+fmtOf(m)(Math.abs(d))}); };
const dl = (m,a,b) => { const t = delta(m,a,b); return h('span',{class: t[0] === '▲' ? 'up' : t[0] === '▼' ? 'dn' : '', text:t}); };
const dnum = (m,v) => { const c = v[NW-1], r = prom3(m,v); if(c == null || r == null || (m.k !== 'ip' && r === 0)) return Infinity; return m.k === 'ip' ? c-r : c/r-1; };
const lbProm = () => 'prom. '+NMESES+' meses';
function renderHero(){
  const [a,b] = D.meta.titulo.split(' · ');
  const h1 = $('#h1'); h1.replaceChildren(a, b ? ' ' : '', b ? h('span',{class:'hl',text:b}) : '');
}
function renderKpis(){
  const box = $('#kpis'); box.replaceChildren();
  MET.forEach((m,i)=>{
    const v = TOT.map(r=>mv(m,r)), cur = v[NW-1], ks = [];
    if(IPREV >= 0) ks.push(h('div',{}, 'vs '+W[IPREV].etiqueta+': ', dl(m,cur,v[IPREV])));
    if(NMESES) ks.push(h('div',{}, 'vs '+lbProm()+': ', dl(m,cur,prom3(m,v))));
    if(LY >= 0) ks.push(h('div',{}, 'vs '+W[LY].etiqueta+': ', dl(m,cur,v[LY])));
    box.append(h('div',{class:'kpi'}, h('div',{class:'kl',text:mt(m)+' · '+W[NW-1].etiqueta}),
      h('div',{class:'kv',text: cur == null ? '–' : fmtOf(m)(cur)}), h('div',{class:'ks'}, ks)));
  });
}
const DOW = ['dom','lun','mar','mié','jue','vie','sáb'];
const SEMS = [[1,7],[8,14],[15,21],[22,31]];       // S1…S4; S4 toma lo que quede del mes
function semanas(ms, mi, m){            // promedio diario de cada semana, sin domingos (S4: los días que queden; el mes del corte solo cuenta hasta el corte)
  const hasta = ms.hasta || ms.ndias;
  return SEMS.map(([a,b])=>{
    const z = {vol:0, vl:0, inv:0, ped:0, cli:0, cd:0}; let n = 0;
    for(let d=a; d<=Math.min(b,hasta); d++){
      if(new Date(ms.anio, ms.mes-1, d).getDay() === 0) continue;
      n++; const r = DIAS[mi][d];
      if(r){ z.vol += r.vol; z.vl += r.vl; z.inv += r.inv; z.ped += r.ped; z.cli += r.cli; z.cd += r.cli; }
    }
    if(!n) return null;
    let v = mv(m,z);
    if(v != null && m.k !== 'tk' && !(m.adit && st.modo === 'prom')) v /= n;       // ticket y promedio por cliente-día ya son promedios del bloque
    return v;
  });
}
function renderCalendario(){
  const m = metSel(), t = $('#cal'), tw = $('#cal_wk'); t.replaceChildren(); tw.replaceChildren(); t.classList.toggle('sm', m.k === 'vl'); tw.classList.toggle('sm', m.k === 'vl');
  $('#cal_titulo').textContent = mt(m)+(m.k === 'vl' && st.modo === 'total' ? ' (S/ miles)' : m.k === 'cli' ? ' (miles)' : '')+' por día'+(st.cat < 0 ? '' : ' · '+D.cats[st.cat])+(st.marca < 0 ? '' : ' · '+D.marcas[st.marca]);
  const fmt = fmtOf(m), cf = (m.adit && st.modo === 'prom') ? (v=>fmtN(v,1)) : m.c;
  const hd = h('tr',{}, h('th',{class:'m',text:''}));
  for(let d=1; d<=31; d++) hd.append(h('th',{text:d}));
  t.append(h('thead',{}, hd));
  tw.append(h('thead',{}, h('tr',{}, SEMS.map(([a,b],i)=> h('th',{text:'S'+(i+1), title:'Días '+a+(i === 3 ? ' en adelante' : '-'+b)+' · promedio diario sin domingos'})))));
  const b = h('tbody'), bw = h('tbody'), marca = ms => (ms.marca || {})[D.cats[st.cat]] || {d3:[], d6:[]};
  const chico = v => m.k === 'vl' ? fmtN(v/1e3,1) : fmtN(v,2);          // domingo con pedido que redondea a cero: se muestra con decimales
  MS.map((ms,mi)=>[ms,mi]).sort((a,b)=> (b[0].tipo === 'anio') - (a[0].tipo === 'anio')).forEach(([ms,mi])=>{      // año anterior primero
    const tr = h('tr',{}, h('td',{class:'m',text:ms.etiqueta}));
    for(let d=1; d<=31; d++){
      if(d > ms.ndias){ tr.append(h('td',{class:'na'})); continue; }
      const fecha = new Date(ms.anio, ms.mes-1, d), dom = fecha.getDay() === 0;
      const mc = marca(ms), r = DIAS[mi][d], v = (m.sinDia || !r) ? null : mv(m,r);
      const pedDom = PEDIDO && dom && !!r && r.ped > 0 && v != null && v !== 0;          // solo en base pedido: el domingo con pedidos muestra su número (en facturación se ocultan)
      const cls = (mc.d3.includes(d) ? 'd3' : mc.d6.includes(d) ? 'd6' : dom ? 'dom' : '') + (pedDom ? ' domp' : '');
      let tx = v == null ? '' : cf(v);
      if(/^-?0([.,]0*)?$/.test(tx)) tx = pedDom ? chico(v) : '';
      else if(dom && !pedDom) tx = '';
      const td = h('td',{class:cls, text:tx});
      td.title = DOW[fecha.getDay()]+' '+d+'-'+String(ms.mes).padStart(2,'0')+'-'+ms.anio+(v == null ? '' : ' · '+fmt(v))+(pedDom ? ' · pedidos en domingo' : '')+(cls.startsWith('d3') ? ' · 3% dscto.' : cls.startsWith('d6') ? ' · 6% dscto.' : '');
      tr.append(td);
    }
    b.append(tr);
    const trw = h('tr',{});
    semanas(ms, mi, m).forEach((v,i)=>{
      const tx = v == null ? '' : cf(v);
      trw.append(h('td',{class:'sw'+(v == null ? ' vac' : ''), text:tx, title:'S'+(i+1)+' · '+ms.etiqueta+(v == null ? '' : ' · '+fmt(v))}));
    });
    bw.append(trw);
  });
  t.append(b); tw.append(bw);
  const hayMarcas = MS.some(ms => Object.values(ms.marca || {}).some(x => x.d3.length || x.d6.length));      // sin días de descuento definidos: solo domingos
  const lg = $('#cal_leg'); lg.replaceChildren(...[h('b',{text:'Leyenda'}),
    hayMarcas ? h('div',{class:'it'}, h('i',{class:'sw d3'}), '3% dscto.') : null,
    hayMarcas ? h('div',{class:'it'}, h('i',{class:'sw d6'}), '6% dscto.') : null,
    h('div',{class:'it'}, h('i',{class:'sw dom'}), 'Domingo (no entra en S1–S4)'),
    PEDIDO ? h('div',{class:'it'}, h('i',{class:'sw domp',text:'12'}), 'Domingo con pedidos') : null,
    h('div',{class:'it'}, 'S1–S4: promedio diario de la semana, sin domingos')].filter(Boolean));
}
function renderVentanas(){
  const av = $('#aviso'), inc = W.filter(w=>w.inc);
  if(inc.length){
    $('#aviso_t').replaceChildren(h('b',{text:'Ventana incompleta. '}),
      inc.map(w=> w.etiqueta+' tiene datos solo hasta el '+w.fecha_max+' (el corte es el '+w.fin+')').join('; ')+
      '. Sus valores son parciales y no son comparables con las demás hasta que se cargue el día completo (marcada con * en los gráficos).');
    av.classList.add('cor'); av.hidden = false;
  }
}
function renderTabla(){
  const m = metSel();
  $('#t_titulo').textContent = mt(m)+' · abierto por '+(st.dim < 0 ? 'total' : DIMX[st.dim].label.toLowerCase())+(st.cat < 0 ? '' : ' · '+D.cats[st.cat])+(st.marca < 0 ? '' : ' · '+D.marcas[st.marca]);
  const t = $('#tabla'); t.replaceChildren();
  const head = ['', ...W.map(w=>w.etiqueta)];
  if(NMESES) head.push(lbProm(), 'Δ abs. vs '+lbProm(), 'Δ % vs '+lbProm());
  if(LY >= 0) head.push('Δ vs '+W[LY].etiqueta);
  t.append(h('thead',{}, h('tr',{}, head.map((x,i)=>h('th',{class: i ? 'n' : '', text:x})))));
  const rows = [];
  if(st.dim >= 0) GRP.forEach((recs,vi)=>{ if(recs.some(r=>r)) rows.push({name:nombreVal(st.dim,vi), vi, recs}); });
  if(st.dim >= 0 && ordenFijo(st.dim,0) != null) rows.sort((a,b)=> ordenFijo(st.dim,a.vi) - ordenFijo(st.dim,b.vi));
  else rows.sort((a,b)=> { const x = dnum(m,a.recs.map(r=>mv(m,r))), y = dnum(m,b.recs.map(r=>mv(m,r)));   // de menor a mayor variación vs prom.
    return (x === y) ? 0 : x - y; });
  const all = [{name:'Total', recs:TOT, tot:true}, ...rows];
  const tb = h('tbody');
  for(const r of all){
    const v = r.recs.map(x=>mv(m,x)), cur = v[NW-1], pr = prom3(m,v);
    const tr = h('tr',{class:r.tot?'tot':''}, h('td',{text:r.name}));
    v.forEach(x=> tr.append(h('td',{class:'n',text: x == null ? '–' : fmtOf(m)(x)})));
    if(NMESES){ tr.append(h('td',{class:'n',text: pr == null ? '–' : fmtOf(m)(pr)})); tr.append(h('td',{class:'n'}, dabs(m,cur,pr))); tr.append(h('td',{class:'n'}, dl(m,cur,pr))); }
    if(LY >= 0) tr.append(h('td',{class:'n'}, dl(m,cur,v[LY])));
    tb.append(tr);
  }
  t.append(tb);
}
/* ---------- detalle de clientes (pop up): categoría y filtros activos ---------- */
const ESTADOS = ['Todos','Dejó de comprar','Compra menos','Nuevo / reactivado','Compra igual o más'];
const MO = {estado:'Todos', q:'', sort:'d', dir:1};
const estadoDe = (va,vp) => vp <= 0 ? (va > 0 ? 'Nuevo / reactivado' : null) : va <= 0 ? 'Dejó de comprar' : va < vp ? 'Compra menos' : 'Compra igual o más';
const fv = v => fmtN(v, Math.abs(v) >= 100 ? 0 : Math.abs(v) >= 10 ? 1 : 2);
function clientesFiltrados(){
  const fc = st.f[CANAL], kx = Object.fromEntries(D.dims.map((d,k)=>[d.key,k])), por = new Map();
  for(let j=0;j<CL.i.length;j++){
    const i = CL.i[j]; if((st.cat >= 0 && CL.c[i] !== st.cat) || (st.marca >= 0 && CL.m[i] !== st.marca) || (fc >= 0 && CL.k[j] !== fc)) continue;
    const a = CL.a[i]; let ok = true;
    for(let k=0;k<NDIM;k++) if(k !== CANAL && !fHas(st.f[k], a[k])){ ok = false; break; }
    if(!ok) continue;
    let r = por.get(CL.cod[i]);                                  // un cliente por código (con «Todas», suma de sus categorías)
    if(!r){ r = {cod:CL.cod[i], va:0, vp:0}; for(const [key] of MCOLS) if(kx[key] != null) r[key] = a[kx[key]] >= 0 ? nombreVal(kx[key], a[kx[key]]) : '–'; por.set(CL.cod[i], r); }
    r.va += CL.va[j]; r.vp += CL.vp[j];
  }
  const out = [];
  por.forEach(r=>{ const e = estadoDe(r.va, r.vp); if(!e) return; r.d = r.va - r.vp; r.r = r.vp > 0 ? r.d / r.vp : null; r.e = e; out.push(r); });
  return out;
}
function csvClientes(rows){
  const q = x => '"'+String(x == null ? '' : x).replace(/"/g,'""')+'"';
  const txt = [MCOLS.map(c=>q(c[1])).join(',')].concat(rows.map(r=> MCOLS.map(c=> c[0] === 'r' ? (r.r == null ? '' : (r.r*100).toFixed(1)) : (c[2] === 2 ? q(+r[c[0]].toFixed(3)) : q(r[c[0]]))).join(','))).join('\n');
  const a = h('a',{href:URL.createObjectURL(new Blob(['\ufeff'+txt],{type:'text/csv;charset=utf-8'})), download:'clientes_'+(st.cat < 0 ? 'todas' : D.cats[st.cat].toLowerCase())+(st.marca < 0 ? '' : '_'+D.marcas[st.marca].toLowerCase())+'.csv'});
  document.body.append(a); a.click(); a.remove();
}
function renderModal(){
  const todos = clientesFiltrados(), cnt = {};
  todos.forEach(r=>{ cnt[r.e] = (cnt[r.e] || 0) + 1; });
  const q = MO.q.trim().toLowerCase();
  let rows = todos.filter(r => (MO.estado === 'Todos' || r.e === MO.estado) && (!q || String(r.cod).toLowerCase().includes(q)));
  const k = MO.sort, txt = MCOLS.find(c=>c[0] === k)[2] < 2;
  rows.sort((a,b)=>{ const x = a[k], y = b[k]; if(x == null) return 1; if(y == null) return -1;
    return MO.dir * (txt ? String(x).localeCompare(String(y),'es',{numeric:true}) : x - y); });
  $('#m_titulo').textContent = (st.cat < 0 ? 'Todas las categorías' : D.cats[st.cat])+(st.marca < 0 ? '' : ' · '+D.marcas[st.marca])+' · '+W[NW-1].etiqueta+' vs '+lbProm()+' (tn)';
  const ctl = $('#m_ctl'); ctl.replaceChildren();
  const seg = h('div',{class:'seg',role:'group','aria-label':'Estado'});
  ESTADOS.forEach(e=> seg.append(h('button',{type:'button',class:MO.estado === e ? 'on' : '', onclick:()=>{ MO.estado = e; renderModal(); }},
    e, h('i',{text: fmtN(e === 'Todos' ? todos.length : (cnt[e] || 0))}))));
  const inp = h('input',{class:'mq',type:'search',placeholder:'Buscar cliente…',value:MO.q,'aria-label':'Buscar cliente'});
  inp.addEventListener('input',()=>{ MO.q = inp.value; const p = inp.selectionStart; renderModal(); const n = $('#m_ctl .mq'); n.focus(); n.setSelectionRange(p,p); });
  ctl.append(seg, inp, h('button',{class:'btn',type:'button',text:'Descargar CSV',onclick:()=>csvClientes(rows)}));
  const sa = rows.reduce((s,r)=>s+r.va,0), sp = rows.reduce((s,r)=>s+r.vp,0), sd = sa - sp;
  $('#m_sum').replaceChildren(h('b',{text:fmtN(rows.length)}), ' clientes · Vol. '+W[NW-1].etiqueta+' ', h('b',{text:fv(sa)+' tn'}), ' · Prom. ', h('b',{text:fv(sp)+' tn'}), ' · Var. ',
    h('span',{class: sd > 0 ? 'up' : sd < 0 ? 'dn' : '', text:(sd > 0 ? '+' : sd < 0 ? '−' : '')+fv(Math.abs(sd))+' tn'+(sp > 0 ? ' ('+(sd/sp*100 >= 0 ? '+' : '')+fmtN(sd/sp*100,1)+'%)' : '')}));
  const t = $('#m_tabla'); t.replaceChildren();
  t.append(h('thead',{}, h('tr',{}, MCOLS.map(c=> h('th',{class:c[2] === 2 ? 'n' : '', text:c[1]+(MO.sort === c[0] ? (MO.dir > 0 ? ' ▲' : ' ▼') : ''),
    onclick:()=>{ if(MO.sort === c[0]) MO.dir = -MO.dir; else { MO.sort = c[0]; MO.dir = 1; } renderModal(); }})))));
  const tb = h('tbody'), MAX = 300;
  rows.slice(0,MAX).forEach(r=> tb.append(h('tr',{}, MCOLS.map(([key,,tp])=>{
    if(key === 'd') return h('td',{class:'n'}, h('span',{class: r.d > 0 ? 'up' : r.d < 0 ? 'dn' : '', text:(r.d > 0 ? '▲ +' : r.d < 0 ? '▼ −' : '')+fv(Math.abs(r.d))}));
    if(key === 'r') return h('td',{class:'n'}, r.r == null ? '–' : h('span',{class: r.r > 0 ? 'up' : r.r < 0 ? 'dn' : '', text:(r.r > 0 ? '▲ +' : r.r < 0 ? '▼ −' : '')+fmtN(Math.abs(r.r)*100,1)+'%'}));
    return h('td',{class: tp === 2 ? 'n' : '', text: tp === 2 ? fv(r[key]) : r[key]}); }))));
  t.append(tb);
  $('#m_foot').textContent = (rows.length > MAX ? 'Mostrando los primeros '+MAX+' de '+fmtN(rows.length)+' clientes; «Descargar CSV» trae todos. ' : '')+
    'Respeta la categoría, la marca y los filtros elegidos. Prom. = promedio de los '+NMESES+' meses anteriores al mismo corte (un mes sin compra cuenta como 0). Var. % vacía = sin compra en esos meses.';
}
function abrirModal(){ MO.q = ''; $('#modal').hidden = false; renderModal(); $('#m_x').focus(); }
function cerrarModal(){ $('#modal').hidden = true; }
function renderTodo(){ renderHero(); renderKpis(); renderCalendario(); renderTabla(); }
function actualizar(){ normalizar(); calcular(); refrescarFiltros(); renderTodo(); if(!$('#modal').hidden) renderModal(); }

{ const lg = $('#logo');
  if(D0.meta.logo) lg.append(h('img',{src:D0.meta.logo, alt:'RGM - Promociones · Advanced Analytics'}));
  else lg.append(h('div',{class:'area-logo-name',text:'RGM · Advanced Analytics'})); }
$('#sub').textContent = D0.meta.subtitulo;
document.title = D0.meta.titulo;
irA(HQ.get('fecha') === 'pedido' ? 'pedido' : 'facturacion');
window.__ok = true;
}catch(err){
  const e = document.createElement('div'); e.className = 'err'; e.textContent = 'Error al armar el reporte: '+err.message;
  document.body.prepend(e); window.__error = String(err.stack || err);
}
})();
